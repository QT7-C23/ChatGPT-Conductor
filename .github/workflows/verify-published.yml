{
  "name": "verify-published",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "candidate_commit": {
          "description": "Exact reviewed 40-hex candidate source SHA",
          "required": true,
          "type": "string"
        },
        "candidate_run": {
          "description": "Successful package-candidate run ID",
          "required": true,
          "type": "string"
        },
        "candidate_artifact": {
          "description": "Exact candidate artifact ID",
          "required": true,
          "type": "string"
        },
        "candidate_digest": {
          "description": "Candidate artifact archive SHA256",
          "required": true,
          "type": "string"
        },
        "approval_run": {
          "description": "Successful approve-release run ID",
          "required": true,
          "type": "string"
        },
        "approval_artifact": {
          "description": "Exact human approval artifact ID",
          "required": true,
          "type": "string"
        },
        "approval_digest": {
          "description": "Human approval artifact archive SHA256",
          "required": true,
          "type": "string"
        },
        "draft_id": {
          "description": "Exact draft release ID in final ACCEPT and publish approval",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "verify": {
      "if": "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "path": "trusted",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24",
            "package-manager-cache": false
          }
        },
        {
          "run": "npm ci --ignore-scripts",
          "working-directory": "trusted"
        },
        {
          "name": "Authenticate dedicated publisher",
          "id": "publisher",
          "uses": "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1",
          "with": {
            "client-id": "Iv23liKIJaTalWOI0IwZ",
            "private-key": "${{ secrets.CONDUCTOR_PUBLISHER_PRIVATE_KEY }}",
            "owner": "QT7-C23",
            "repositories": "ChatGPT-Conductor",
            "permission-contents": "read",
            "permission-actions": "read",
            "permission-administration": "read"
          }
        },
        {
          "name": "Gate verify-published",
          "run": "node scripts/release-workflow.mjs verify-published",
          "working-directory": "trusted",
          "env": {
            "CANDIDATE_COMMIT": "${{ inputs.candidate_commit }}",
            "CANDIDATE_RUN": "${{ inputs.candidate_run }}",
            "CANDIDATE_ARTIFACT": "${{ inputs.candidate_artifact }}",
            "CANDIDATE_DIGEST": "${{ inputs.candidate_digest }}",
            "APPROVAL_RUN": "${{ inputs.approval_run }}",
            "APPROVAL_ARTIFACT": "${{ inputs.approval_artifact }}",
            "APPROVAL_DIGEST": "${{ inputs.approval_digest }}",
            "GH_TOKEN": "${{ steps.publisher.outputs.token }}",
            "RELEASE_CONFIG_TOKEN": "${{ secrets.RELEASE_CONFIG_TOKEN || steps.publisher.outputs.token }}",
            "DRAFT_ID": "${{ inputs.draft_id }}",
            "PUBLISHER_INSTALLATION_ID": "${{ steps.publisher.outputs.installation-id }}",
            "PUBLISHER_SLUG": "${{ steps.publisher.outputs.app-slug }}"
          }
        }
      ]
    }
  }
}
