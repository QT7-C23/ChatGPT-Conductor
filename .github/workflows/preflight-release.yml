{
  "name": "preflight-release",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "check": {
      "if": "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "path": "trusted",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24",
            "package-manager-cache": false
          }
        },
        {
          "run": "npm ci --ignore-scripts",
          "working-directory": "trusted"
        },
        {
          "name": "Authenticate dedicated publisher",
          "id": "publisher",
          "uses": "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1",
          "with": {
            "client-id": "Iv23liKIJaTalWOI0IwZ",
            "private-key": "${{ secrets.CONDUCTOR_PUBLISHER_PRIVATE_KEY }}",
            "owner": "QT7-C23",
            "repositories": "ChatGPT-Conductor",
            "permission-contents": "read",
            "permission-actions": "read",
            "permission-administration": "read"
          }
        },
        {
          "name": "Read release configuration",
          "run": "node scripts/release-workflow.mjs preflight",
          "working-directory": "trusted",
          "env": {
            "GH_TOKEN": "${{ steps.publisher.outputs.token }}",
            "RELEASE_CONFIG_TOKEN": "${{ secrets.RELEASE_CONFIG_TOKEN || steps.publisher.outputs.token }}",
            "PUBLISHER_INSTALLATION_ID": "${{ steps.publisher.outputs.installation-id }}",
            "PUBLISHER_SLUG": "${{ steps.publisher.outputs.app-slug }}"
          }
        },
        {
          "name": "Save configuration preflight",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "configuration-preflight",
            "path": "trusted/preflight-output/configuration.json",
            "if-no-files-found": "error",
            "overwrite": false,
            "archive": true
          }
        }
      ]
    }
  }
}
