{
  "name": "package-candidate",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "candidate_commit": {
          "description": "Exact reviewed 40-hex candidate source SHA",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "build": {
      "if": "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "path": "trusted",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24",
            "package-manager-cache": false
          }
        },
        {
          "run": "npm ci --ignore-scripts",
          "working-directory": "trusted"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ inputs.candidate_commit }}",
            "path": "candidate-source",
            "persist-credentials": false
          }
        },
        {
          "run": "npm ci --ignore-scripts",
          "working-directory": "candidate-source"
        },
        {
          "name": "Gate candidate",
          "run": "node scripts/release-workflow.mjs candidate",
          "working-directory": "trusted",
          "env": {
            "CANDIDATE_COMMIT": "${{ inputs.candidate_commit }}"
          }
        },
        {
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "candidate",
            "path": "trusted/candidate-output/chatgpt-conductor-1.2.0.zip\ntrusted/candidate-output/candidate.json\ntrusted/candidate-output/payload-inventory.json\ntrusted/candidate-output/CHANGELOG.md\ntrusted/candidate-output/build-evidence.json",
            "if-no-files-found": "error",
            "overwrite": false,
            "archive": true
          }
        }
      ]
    }
  }
}
